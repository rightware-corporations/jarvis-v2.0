# TE-05E live harness (NOT triggered by this branch): ONE real run per model and request, only when a
# separately authorised request file is pushed to exp/te05e-live-qwen. Same IANA objectives and limits
# as TE-05 (max_calls=10, max_turns=10, deadline 115 s, engine timeout 120 s, --warmup).
# TE-05E change: the job FAILS unless the functional verdict is PASS_LIMITED (infrastructure success is
# no longer reported as task success); the sanitized evidence is uploaded in every case.
name: TE-05E IANA live Qwen one-shot (truthful verdict)
on:
  push:
    branches: [exp/te05e-live-qwen]
    paths: [ops/te05e_live_model_request.json]
permissions:
  contents: read
concurrency:
  group: te05e-live-qwen
  cancel-in-progress: false
env:
  OLLAMA_VERSION: "0.40.15"
  OLLAMA_SHA256: "628c018404a4206493efd38e46251c154ede5141b8b8dc85c659b3b027c47379"
  OLLAMA_HOST: "127.0.0.1:11434"
  OLLAMA_NO_CLOUD: "1"
  PIN: "f21d902f4d3bd7f0f3f138f1a4613019a394b549"
  NO_PROXY: "127.0.0.1,localhost,::1"
jobs:
  isolated:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
      - name: Gate 0 — bound exact code, single request, fixed model per request
        run: |
          set -euo pipefail
          mkdir -p ev
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$GITHUB_REF" = "refs/heads/exp/te05e-live-qwen"
          test "$(git diff-tree --no-commit-id --name-only -r HEAD)" = "ops/te05e_live_model_request.json"
          test "$(git ls-tree HEAD vendor/openjarvis | awk '{print $3}')" = "$PIN"
          test "$(git -C vendor/openjarvis rev-parse HEAD)" = "$PIN"
          python3 -I - <<'PY'
          import json,os,subprocess
          p=json.load(open('ops/te05e_live_model_request.json'))
          assert set(p)=={'experiment','request_id','approved_code_sha','model','scope'}
          assert p['experiment']=='TE05E_IANA_LIVE_QWEN' and p['scope']=='PUBLIC_IANA_READ_ONLY'
          expected={1:('qwen3.5:2b','0689d44085e06d165161a8a9a1731344278cfb5aade63a3c3dbdb48ab54b130a'),
                    2:('qwen3.5:4b','d8b0f5e9760cd1682034f292d7ef72ec46f432149be0df7574bf2d6e92e38c04')}
          model,digest=expected[p['request_id']]
          assert p['model']==model
          sha=p['approved_code_sha']
          # Only the request file may differ from the approved code commit.
          changed=subprocess.check_output(['git','diff','--name-only',sha,'HEAD'],text=True).split()
          assert changed==['ops/te05e_live_model_request.json'],changed
          subprocess.check_call(['git','merge-base','--is-ancestor',sha,'HEAD'])
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write(f"MODEL={model}\nDIGEST={digest}\nREQUEST_ID={p['request_id']}\n")
          with open('ev/preflight.json','w') as f:
              json.dump({'code_sha':sha,'request_sha':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
                         'request_id':p['request_id'],'model':model,'preflight':'PASS'},f)
          PY
          RAM=$(awk '/MemTotal/ {printf "%d", $2/1048576}' /proc/meminfo)
          test "$RAM" -ge 12 && test "$(nproc)" -ge 4
          echo "{\"ram_gib\": $RAM, \"nproc\": $(nproc)}" > ev/host.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Frozen OpenJarvis and complete fake regression suite
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "uv==0.11.32"
          uv sync --project vendor/openjarvis --frozen --no-dev --python "$(which python)"
          vendor/openjarvis/.venv/bin/python -m unittest discover -s tests -v > ev/fake-tests.log 2>&1
          ! grep -q " skipped" ev/fake-tests.log
          tail -3 ev/fake-tests.log
      - name: Install verified local Ollama and the requested Qwen model
        run: |
          set -euo pipefail
          ARCHIVE="$RUNNER_TEMP/ollama.tar.zst"
          curl -fsSL --retry 3 -o "$ARCHIVE" "https://github.com/ollama/ollama/releases/download/v$OLLAMA_VERSION/ollama-linux-amd64.tar.zst"
          echo "$OLLAMA_SHA256  $ARCHIVE" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/ollama" "$RUNNER_TEMP/ollama-models"
          tar -I zstd -xf "$ARCHIVE" -C "$RUNNER_TEMP/ollama"
          rm -f "$ARCHIVE"
          export OLLAMA_MODELS="$RUNNER_TEMP/ollama-models"
          echo "OLLAMA_MODELS=$OLLAMA_MODELS" >> "$GITHUB_ENV"
          nohup "$RUNNER_TEMP/ollama/bin/ollama" serve > "$RUNNER_TEMP/service.log" 2>&1 &
          OK=0
          for i in $(seq 1 60); do
            if curl -fsS --noproxy '*' http://127.0.0.1:11434/api/version > ev/version.json; then OK=1; break; fi
            sleep 2
          done
          test "$OK" = "1"
          "$RUNNER_TEMP/ollama/bin/ollama" pull "$MODEL" > "$RUNNER_TEMP/model-pull.log" 2>&1
          curl -fsS --noproxy '*' http://127.0.0.1:11434/api/tags > ev/models.json
          python3 -I - <<'PY'
          import json,os
          models=json.load(open('ev/models.json'))['models']
          hits=[x['digest'] for x in models if x.get('name')==os.environ['MODEL']]
          assert hits==[os.environ['DIGEST']], hits
          PY
      - name: Single real model task — fixed IANA host, zero OS tools, --warmup
        run: |
          set -euo pipefail
          set +e
          # Outer harness kill only: 200 s as in TE-03/TE-04 plus 120 s for the separately reported
          # warm-up (one engine call). Task limits are unchanged and enforced inside the CLI.
          timeout 320 python jarvis.py task --allow-public-read --model "$MODEL" --json --warmup > ev/task.json 2> ev/stderr.txt
          RC=$?
          set -e
          echo "$RC" > ev/exit.txt
      - name: Functional verdict — fails unless PASS_LIMITED (ERROR, INCOMPLETE, REVIEW, BLOCKED are failures)
        run: |
          set -euo pipefail
          python3 -I labs/te05e_live/verdict.py ev
      - name: Job summary — infrastructure vs functional result
        if: always()
        run: |
          python3 -I - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json,pathlib
          p=pathlib.Path('ev/verdict.json')
          v=json.loads(p.read_text()) if p.exists() else {'verdict':'BLOCKED'}
          print(f"Functional verdict: **{v.get('verdict')}** (operational state: {v.get('operational_state','n/a')}, "
                f"error code: {v.get('error_code','n/a')}). A green infrastructure step is not task acceptance.")
          PY
      - name: Preserve bounded evidence without conversation transcripts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: te05e-iana-live-${{ env.REQUEST_ID }}
          path: |
            ev/preflight.json
            ev/host.json
            ev/version.json
            ev/models.json
            ev/task.json
            ev/exit.txt
            ev/verdict.json
            ev/stderr.txt
          retention-days: 7
          if-no-files-found: ignore
