# WORK-04 R2 static-only validation; explicitly no Ollama, model or GPU.
# Restricted to the isolated R2 branch. Public repository standard runner.
name: RIGHTWARE WORK-04 R2 static regression
on:
  push:
    branches:
      - feat/work04-r2-semantic-safety
permissions:
  contents: read
concurrency:
  group: work04-r2-static
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      UV_LINK_MODE: copy
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'
      - name: Install pinned OpenJarvis core only
        run: |
          python -m pip install --disable-pip-version-check "uv==0.11.32"
          uv sync --project vendor/openjarvis --frozen --no-dev --python "$(which python)"
      - name: WORK-04 R2 plus original FAKE regressions
        working-directory: labs/work04_cognitive/tests
        env:
          HOME: ${{ runner.temp }}/home
        run: |
          ../../../vendor/openjarvis/.venv/bin/python -m unittest -v test_w04_fake test_w04_workflow test_w04_r2_completion test_w04_r2_source_guard test_w04_r2_semantics test_w04_r2_classification
      - name: WORK-02 historical FAKE regressions
        working-directory: labs/work02_active_agent/tests
        env:
          HOME: ${{ runner.temp }}/home
        run: |
          ../../../vendor/openjarvis/.venv/bin/python -m unittest -v test_security_fake test_variability_fake test_work03_workflow
      - name: RIGHTWARE foundation regressions (Linux)
        run: |
          python -m unittest discover -s tests -v
