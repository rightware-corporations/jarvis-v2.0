name: WORK-05 product tools — deterministic only
on:
  push:
    branches:
      - feat/work05-product-agent-foundation
  pull_request:
    branches:
      - feat/work04-r2-semantic-safety
permissions:
  contents: read
jobs:
  product-boundary:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'
      - name: Compile product and deterministic tests
        run: python -m compileall -q rightware tests
      - name: Product unit tests (no Ollama, no Qwen, no browser network)
        run: python -m unittest discover -s tests -v
      - name: Security boundary tests, explicitly
        run: python -m unittest discover -s tests -p 'test_agent_tools.py' -v
