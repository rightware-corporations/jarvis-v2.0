# WORK-05 product agent: deterministic tests only (FAKE engine, mock HTTP).
# No Ollama, no model, no inference, no outbound page reads.
name: RIGHTWARE WORK-05 product agent tests
on:
  push:
    branches:
      - develop
      - feat/work05-product-agent
  pull_request:
    branches:
      - develop
permissions:
  contents: read
concurrency:
  group: work05-product-${{ github.ref }}
  cancel-in-progress: true
jobs:
  product:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      UV_LINK_MODE: copy
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'
      - name: RIGHTWARE suite on plain Python (OpenJarvis-dependent tests skip here)
        run: python -m unittest discover -s tests -v
      - name: Install pinned OpenJarvis core (frozen lockfile)
        run: |
          python -m pip install --disable-pip-version-check "uv==0.11.32"
          uv sync --project vendor/openjarvis --frozen --no-dev --python "$(which python)"
      - name: RIGHTWARE suite in the pinned OpenJarvis venv (no test may skip)
        env:
          HOME: ${{ runner.temp }}/home
        run: |
          set -euo pipefail
          vendor/openjarvis/.venv/bin/python -m unittest discover -s tests -v 2>&1 | tee "$RUNNER_TEMP/venv-tests.txt"
          if grep -q "skipped" "$RUNNER_TEMP/venv-tests.txt"; then echo "a test was skipped in the venv"; exit 1; fi
