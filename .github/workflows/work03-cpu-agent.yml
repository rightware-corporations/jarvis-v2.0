# WORK-03 — EXPERIMENTAL, MANUAL ONLY. Real Qwen3.5 4B + OpenJarvis Orchestrator
# on a standard GitHub-hosted CPU runner, gate by gate (docs/research/WORK03_*).
#
# Trigger: workflow_dispatch only. GitHub only dispatches workflows whose file
# exists on the DEFAULT branch (main). While this file lives only on develop it
# is inert: it cannot run on push, PR or schedule. Activation is a CEO decision.
#
# Nothing here runs model-generated commands; the model only reaches the four
# allowlisted WORK-02 lab tools inside the lab sandbox.
name: WORK-03 CPU real agent (manual)

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Exact 40-char commit to test (lab code at this revision)"
        required: true
        type: string
      up_to_gate:
        description: "Last gate to run (2=Ollama, 3=model, 4=one tool call, 5=full WORK-02)"
        required: true
        default: "3"
        type: choice
        options: ["2", "3", "4", "5"]
      gate5_authorization:
        description: "Type AUTORIZO-WORK03-GATE5 to allow the full N=10 + 3 run"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: work03-cpu-agent
  cancel-in-progress: false

env:
  PIN: f21d902f4d3bd7f0f3f138f1a4613019a394b549
  OLLAMA_VERSION: "0.40.15"
  OLLAMA_SHA256: 628c018404a4206493efd38e46251c154ede5141b8b8dc85c659b3b027c47379
  MODEL: "qwen3.5:4b"
  UV_VERSION: "0.11.32"
  JARVIS_NUM_CTX: "8192"
  MIN_RAM_GIB: "14"
  MIN_FREE_DISK_GIB: "15"

jobs:
  work03:
    runs-on: ubuntu-24.04
    timeout-minutes: 345            # GitHub-hosted hard limit is 360
    steps:
      - name: GATE 0a — validate dispatch inputs
        env:
          SHA: ${{ inputs.sha }}
          UP_TO: ${{ inputs.up_to_gate }}
          AUTH: ${{ inputs.gate5_authorization }}
        run: |
          set -euo pipefail
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "sha must be a full 40-char lowercase commit"; exit 1; }
          if [[ "$UP_TO" == "5" && "$AUTH" != "AUTORIZO-WORK03-GATE5" ]]; then
            echo "GATE 5 requested without the typed authorization"; exit 1
          fi
          EVID="$RUNNER_TEMP/work03-evidence"; mkdir -p "$EVID"
          echo "EVID=$EVID" >> "$GITHUB_ENV"
          echo "OLLAMA_DIR=$RUNNER_TEMP/ollama" >> "$GITHUB_ENV"
          echo "OLLAMA_MODELS=$RUNNER_TEMP/ollama-models" >> "$GITHUB_ENV"
          printf '{"gate":"0a","status":"PASS","sha":"%s","up_to_gate":"%s","actor":"%s","run_id":"%s"}\n' \
            "$SHA" "$UP_TO" "$GITHUB_ACTOR" "$GITHUB_RUN_ID" >> "$EVID/gates.jsonl"

      - name: Checkout the exact revision (pinned submodule)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          ref: ${{ inputs.sha }}
          submodules: recursive
          persist-credentials: false

      - name: GATE 0 — integrity (SHA, pin, clean tree, lab present)
        env:
          SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SHA"
          test "$(git ls-tree HEAD vendor/openjarvis | awk '{print $3}')" = "$PIN"
          test "$(git -C vendor/openjarvis rev-parse HEAD)" = "$PIN"
          test -z "$(git status --porcelain)"
          test -z "$(git -C vendor/openjarvis status --porcelain)"
          for f in labs/work02_active_agent/run_real.py labs/work02_active_agent/gate4_tool_smoke.py \
                   labs/work02_active_agent/w02lab/harness.py vendor/openjarvis/uv.lock; do test -f "$f"; done
          printf '{"gate":"0","status":"PASS","repo_sha":"%s","pin":"%s"}\n' "$SHA" "$PIN" >> "$EVID/gates.jsonl"

      - name: GATE 1 — environment (CPU, RAM, disk, Python, Rust)
        run: |
          set -euo pipefail
          free_gib() { df -BG --output=avail "$1" | tail -1 | tr -dc 0-9; }
          RAM_GIB=$(awk '/MemTotal/ {printf "%d", $2/1048576}' /proc/meminfo)
          DISK=$(free_gib "$RUNNER_TEMP")
          if [ "$DISK" -lt "$MIN_FREE_DISK_GIB" ]; then
            # Ephemeral runner only: drop large preinstalled SDKs the job never uses.
            echo "Only ${DISK}G free; removing unused preinstalled toolchains on this ephemeral runner"
            sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
            DISK=$(free_gib "$RUNNER_TEMP")
          fi
          {
            echo "## Environment"; uname -a; nproc; lscpu | grep -E 'Model name|^CPU\(s\)|Flags' | cut -c1-200
            free -h; df -h / "$RUNNER_TEMP" "$GITHUB_WORKSPACE"; python3 --version
            rustc --version 2>/dev/null || echo "rustc: not present (not required by the lab)"
          } | tee "$EVID/environment.txt"
          STATUS=PASS
          [ "$RAM_GIB" -ge "$MIN_RAM_GIB" ] || STATUS="ENVIRONMENT BLOCKED"
          [ "$DISK" -ge "$MIN_FREE_DISK_GIB" ] || STATUS="ENVIRONMENT BLOCKED"
          printf '{"gate":"1","status":"%s","vcpu":%s,"ram_gib":%s,"free_disk_gib":%s}\n' \
            "$STATUS" "$(nproc)" "$RAM_GIB" "$DISK" >> "$EVID/gates.jsonl"
          [ "$STATUS" = PASS ]

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"

      - name: Install pinned OpenJarvis core from the frozen lockfile
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "uv==${UV_VERSION}"
          uv sync --project vendor/openjarvis --frozen --no-dev --python "$(which python)" 2>&1 | tail -5
          vendor/openjarvis/.venv/bin/python -c "import importlib.metadata as m; from openjarvis.agents.orchestrator import OrchestratorAgent; print('openjarvis', m.version('openjarvis'))" \
            | tee -a "$EVID/environment.txt"
          du -sh vendor/openjarvis/.venv | tee -a "$EVID/environment.txt"

      - name: GATE 2 — official Ollama (SHA-256 verified), loopback only
        run: |
          set -euo pipefail
          ARCHIVE="$RUNNER_TEMP/ollama.tar.zst"
          curl -fsSL --retry 3 -o "$ARCHIVE" \
            "https://github.com/ollama/ollama/releases/download/v${OLLAMA_VERSION}/ollama-linux-amd64.tar.zst"
          echo "${OLLAMA_SHA256}  ${ARCHIVE}" | sha256sum -c -
          mkdir -p "$OLLAMA_DIR" "$OLLAMA_MODELS"
          tar -I zstd -xf "$ARCHIVE" -C "$OLLAMA_DIR"
          rm -f "$ARCHIVE"
          # CPU runner: GPU runtime libraries are unused; record and remove them to save disk.
          du -sh "$OLLAMA_DIR"/lib/ollama/* 2>/dev/null | tee "$EVID/ollama-libs.txt" || true
          find "$OLLAMA_DIR/lib/ollama" -maxdepth 1 -type d \( -name 'cuda*' -o -name 'rocm*' -o -name 'vulkan*' \) \
            -exec rm -rf {} + 2>/dev/null || true
          OLLAMA_HOST=127.0.0.1:11434 OLLAMA_NO_CLOUD=1 nohup "$OLLAMA_DIR/bin/ollama" serve \
            > "$EVID/ollama-server.log" 2>&1 &
          for i in $(seq 1 60); do curl -fs --noproxy '*' http://127.0.0.1:11434/api/version && break; sleep 2; done
          V=$(curl -fs --noproxy '*' http://127.0.0.1:11434/api/version | python3 -c 'import json,sys;print(json.load(sys.stdin)["version"])')
          test "$V" = "$OLLAMA_VERSION"
          ss -ltn | grep ':11434' | tee "$EVID/ollama-listen.txt"
          if ss -ltn | grep ':11434' | grep -vq '127.0.0.1:11434'; then echo "Ollama listens beyond loopback"; exit 1; fi
          printf '{"gate":"2","status":"PASS","ollama":"%s","listen":"127.0.0.1:11434"}\n' "$V" >> "$EVID/gates.jsonl"

      - name: GATE 3 — real model present and generating
        if: fromJSON(inputs.up_to_gate) >= 3
        run: |
          set -euo pipefail
          "$OLLAMA_DIR/bin/ollama" pull "$MODEL" 2>&1 | tail -3
          curl -fs --noproxy '*' http://127.0.0.1:11434/api/tags > "$EVID/ollama-tags.json"
          DIGEST=$(python3 -c 'import json,sys,os;m=[x for x in json.load(open(sys.argv[1]))["models"] if x["name"]==os.environ["MODEL"]];print(m[0]["digest"] if m else "")' "$EVID/ollama-tags.json")
          test -n "$DIGEST"
          START=$(date +%s.%N)
          curl -fs --noproxy '*' --max-time 900 http://127.0.0.1:11434/api/generate -d "{\"model\":\"$MODEL\",\"prompt\":\"Responde apenas: pronto.\",\"stream\":false,\"think\":false,\"options\":{\"num_ctx\":${JARVIS_NUM_CTX},\"num_predict\":16}}" \
            > "$EVID/gate3-generate.json"
          SECS=$(python3 -c "import time;print(round($(date +%s.%N)-$START,2))")
          RESP=$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["response"].strip()[:80])' "$EVID/gate3-generate.json")
          curl -fs --noproxy '*' http://127.0.0.1:11434/api/ps > "$EVID/ollama-ps.json"
          test -n "$RESP"
          printf '{"gate":"3","status":"QWEN REAL PASS","model":"%s","digest":"%s","first_generate_s":%s}\n' \
            "$MODEL" "$DIGEST" "$SECS" >> "$EVID/gates.jsonl"

      - name: GATE 4 — one real tool call by the model (OrchestratorAgent)
        if: fromJSON(inputs.up_to_gate) >= 4
        run: |
          set -euo pipefail
          set +e
          vendor/openjarvis/.venv/bin/python labs/work02_active_agent/gate4_tool_smoke.py \
            --model "$MODEL" --engine-timeout 600 --timeout 900 --out "$EVID/gate4.json"
          RC=$?
          set -e
          STATUS=$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["status"])' "$EVID/gate4.json" 2>/dev/null || echo "ENVIRONMENT BLOCKED")
          printf '{"gate":"4","status":"%s","exit":%s}\n' "$STATUS" "$RC" >> "$EVID/gates.jsonl"
          exit $RC

      - name: GATE 5 — full WORK-02 (N=10 + 3 security, criteria unchanged)
        if: inputs.up_to_gate == '5' && inputs.gate5_authorization == 'AUTORIZO-WORK03-GATE5'
        env:
          SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          set +e
          vendor/openjarvis/.venv/bin/python labs/work02_active_agent/run_real.py \
            --expect-sha "$SHA" --model "$MODEL" --n 10 --security-n 3 --allow-cpu \
            --timeout 1200 --engine-timeout 600 --evidence-dir "$EVID/work02-real"
          RC=$?
          set -e
          case $RC in 0) S="QWEN REAL PASS";; 1) S="QWEN REAL FAIL";; *) S="ENVIRONMENT BLOCKED";; esac
          printf '{"gate":"5","status":"%s","exit":%s}\n' "$S" "$RC" >> "$EVID/gates.jsonl"
          exit $RC

      - name: Classify and summarise (always)
        if: always()
        env:
          UP_TO: ${{ inputs.up_to_gate }}
          JOB_STATUS: ${{ job.status }}
        run: |
          python3 - <<'PY'
          import json, os
          evid = os.environ.get("EVID") or os.path.join(os.environ["RUNNER_TEMP"], "work03-evidence")
          os.makedirs(evid, exist_ok=True)
          path = os.path.join(evid, "gates.jsonl")
          gates = [json.loads(l) for l in open(path)] if os.path.exists(path) else []
          seen = {g["gate"]: g["status"] for g in gates}
          wanted = ["0a", "0", "1", "2"] + [str(g) for g in range(3, int(os.environ["UP_TO"]) + 1)]
          table = {g: seen.get(g, "NOT RUN") for g in ["0a", "0", "1", "2", "3", "4", "5"]}
          failed_infra = [g for g in ["0a", "0", "1", "2"] if table[g] != "PASS"]
          bad = [(g, v) for g, v in table.items() if "FAIL" in v or "BLOCKED" in v]
          if "5" in seen:
              overall = seen["5"]
          elif bad:
              overall = f"{bad[0][1]} (GATE {bad[0][0]})"
          elif failed_infra or any(table[g] == "NOT RUN" for g in wanted):
              overall = "ENVIRONMENT BLOCKED"
          else:
              overall = f"STOPPED AFTER GATE {os.environ['UP_TO']} (WORK-02 NOT RUN)"
          summary = {"gates": table, "overall": overall, "job_status": os.environ["JOB_STATUS"],
                     "note": "CI/Ollama success is not agent success; only GATE 5 decides WORK-02."}
          json.dump(summary, open(os.path.join(evid, "work03-summary.json"), "w"), indent=2)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as s:
              s.write("## WORK-03 gates\n\n| Gate | Status |\n|---|---|\n")
              s.writelines(f"| {g} | {v} |\n" for g, v in table.items())
              s.write(f"\n**Overall:** {overall}\n")
          print(json.dumps(summary, indent=2))
          PY
          # Sanitize: keep only the tail of the server log; no environment dump anywhere.
          if [ -f "$EVID/ollama-server.log" ]; then tail -n 300 "$EVID/ollama-server.log" > "$EVID/ollama-server.tail.log"; rm -f "$EVID/ollama-server.log"; fi
          pkill -f "ollama serve" || true

      - name: Upload evidence (always)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: work03-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/work03-evidence
          if-no-files-found: warn
          retention-days: 30
