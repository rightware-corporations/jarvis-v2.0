# TE-05 one-shot 4b warm-up comparison. Preserve original tools, 10/10/115 and IANA objectives.
name: TE-05 IANA 4b warm-up one-shot
on:
  push:
    branches: [exp/te05-live-qwen-20261117]
    paths: [ops/te05_live_4b_request.json]
permissions:
  contents: read
concurrency:
  group: te05-live-4b-one-shot
  cancel-in-progress: false
env:
  OLLAMA_VERSION: "0.40.15"
  OLLAMA_SHA256: "628c018404a4206493efd38e46251c154ede5141b8b8dc85c659b3b027c47379"
  MODEL: "qwen3.5:4b"
  OLLAMA_HOST: "127.0.0.1:11434"
  OLLAMA_NO_CLOUD: "1"
  PIN: "f21d902f4d3bd7f0f3f138f1a4613019a394b549"
  NO_PROXY: "127.0.0.1,localhost,::1"
jobs:
  isolated:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive
          fetch-depth: 2
          persist-credentials: false
      - name: Gate 0 — bound exact commit and single request
        run: |
          set -euo pipefail
          mkdir -p te05-4b-evidence
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$GITHUB_REF" = "refs/heads/exp/te05-live-qwen-20261117"
          test "$(git diff-tree --no-commit-id --name-only -r HEAD)" = "ops/te05_live_4b_request.json"
          test "$(git ls-tree HEAD vendor/openjarvis | awk '{print $3}')" = "$PIN"
          test "$(git -C vendor/openjarvis rev-parse HEAD)" = "$PIN"
          python3 -I - <<'PY'
          import json,subprocess
          p=json.load(open('ops/te05_live_4b_request.json'))
          assert set(p)=={'experiment','request_id','approved_code_sha','model','scope'}
          assert p['experiment']=='TE05_IANA_LIVE_4B' and p['request_id']==1
          assert p['model']=='qwen3.5:4b' and p['scope']=='PUBLIC_IANA_READ_ONLY'
          parent=subprocess.check_output(['git','rev-parse','HEAD^'],text=True).strip()
          assert parent==p['approved_code_sha']
          with open('te05-4b-evidence/preflight.json','w') as f:json.dump({'code_sha':parent,'model':p['model'],'preflight':'PASS'},f)
          PY
          RAM=$(awk '/MemTotal/ {printf "%d", $2/1048576}' /proc/meminfo)
          test "$RAM" -ge 12 && test "$(nproc)" -ge 4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Frozen OpenJarvis and complete fake regression suite
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "uv==0.11.32"
          uv sync --project vendor/openjarvis --frozen --no-dev --python "$(which python)"
          vendor/openjarvis/.venv/bin/python -m unittest discover -s tests -v > te05-4b-evidence/fake-tests.log 2>&1
          ! grep -q " skipped" te05-4b-evidence/fake-tests.log
          tail -3 te05-4b-evidence/fake-tests.log
      - name: Install verified local Ollama and Qwen 4b
        run: |
          set -euo pipefail
          ARCHIVE="$RUNNER_TEMP/ollama.tar.zst"
          curl -fsSL --retry 3 -o "$ARCHIVE" "https://github.com/ollama/ollama/releases/download/v$OLLAMA_VERSION/ollama-linux-amd64.tar.zst"
          echo "$OLLAMA_SHA256  $ARCHIVE" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/ollama" "$RUNNER_TEMP/ollama-models"
          tar -I zstd -xf "$ARCHIVE" -C "$RUNNER_TEMP/ollama"
          rm -f "$ARCHIVE"
          export OLLAMA_MODELS="$RUNNER_TEMP/ollama-models"
          echo "OLLAMA_MODELS=$OLLAMA_MODELS" >> "$GITHUB_ENV"
          nohup "$RUNNER_TEMP/ollama/bin/ollama" serve > te05-4b-evidence/service.log 2>&1 &
          OK=0
          for i in $(seq 1 60); do
            if curl -fsS --noproxy '*' http://127.0.0.1:11434/api/version > te05-4b-evidence/version.json; then OK=1; break; fi
            sleep 2
          done
          test "$OK" = "1"
          "$RUNNER_TEMP/ollama/bin/ollama" pull "$MODEL" > te05-4b-evidence/model-pull.log 2>&1
          curl -fsS --noproxy '*' http://127.0.0.1:11434/api/tags > te05-4b-evidence/models.json
          python3 -I - <<'PY'
          import json
          models=json.load(open('te05-4b-evidence/models.json'))['models']
          hits=[x['digest'] for x in models if x.get('name')=='qwen3.5:4b']
          assert hits==['d8b0f5e9760cd1682034f292d7ef72ec46f432149be0df7574bf2d6e92e38c04'], hits
          PY
      - name: Single real model task — fixed IANA host, zero OS tools
        run: |
          set -euo pipefail
          set +e
          timeout 230 python jarvis.py task --allow-public-read --warmup --model "$MODEL" --json > te05-4b-evidence/task.json 2> te05-4b-evidence/stderr.txt
          RC=$?
          set -e
          echo "$RC" > te05-4b-evidence/exit.txt
          python3 -I - <<'PY'
          import json,pathlib
          p=pathlib.Path('te05-4b-evidence')
          code=int((p/'exit.txt').read_text())
          try:
              d=json.loads((p/'task.json').read_text())
              st={x['id']:x['state'] for x in d['objectives']}
              safe=(set(st)=={'IANA_RESERVED','IANA_EXAMPLE'} and d['factual_verified'] is False
                    and d['completion_verified'] is False and d['route']=='TASK')
              observed=all(x=='PAGE_OBSERVED' for x in st.values())
              verdict='PASS_LIMITED' if code==3 and safe and observed else 'REVIEW'
              warm=d.get('timing',{}).get('warmup') or {}
              if warm.get('state')!='OK': verdict='BLOCKED'
              result={'verdict':verdict,'exit_code':code,'states':st,
                      'operational_state':d['operational_state'],'contract_safe':safe,
                      'halt_reason_code':d.get('halt_reason_code','NOT_RECORDED'),
                      'receipt_events':d.get('receipt_events',[]),
                      'receipt_reason_codes':d.get('receipt_reason_codes',[]),
                      'continuations':d.get('continuations',0),
                      'generation_totals':d.get('generation_totals',{}),
                      'timing':d.get('timing',{})}
          except Exception as e:
              result={'verdict':'BLOCKED','exit_code':code,'error_type':type(e).__name__}
          (p/'verdict.json').write_text(json.dumps(result,indent=2))
          print(json.dumps({'verdict':result['verdict'],
            'states':result.get('states',{}),
            'operational_state':result.get('operational_state'),
            'halt_reason_code':result.get('halt_reason_code'),
            'receipts':len(result.get('receipt_events',[])),
            'warmup_state':result.get('timing',{}).get('warmup',{}).get('state','MISSING')}))
          if result['verdict']!='PASS_LIMITED':raise SystemExit(1)
          PY
      - name: Preserve bounded evidence without conversation transcripts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: te05-iana-4b-warmup
          path: |
            te05-4b-evidence/preflight.json
            te05-4b-evidence/version.json
            te05-4b-evidence/models.json
            te05-4b-evidence/task.json
            te05-4b-evidence/exit.txt
            te05-4b-evidence/verdict.json
            te05-4b-evidence/stderr.txt
          retention-days: 7
          if-no-files-found: ignore
